name: Nix Flake actions

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    nix-matrix-server:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
              with:
                  extra-conf: |
                      accept-flake-config = true
            - id: set-matrix
              name: Generate Nix Matrix
              run: |
                  set -Eeu
                  matrix="$(nix eval --json '.#githubActions-server.matrix')"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix-matrix-docker:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
              with:
                  extra-conf: |
                      accept-flake-config = true
            - id: set-matrix
              name: Generate Nix Matrix
              run: |
                  set -Eeu
                  matrix="$(nix eval --json '.#githubActions-docker.matrix')"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    build-server-binary:
        needs: nix-matrix-server
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            packages: write
        services:
            oranc:
                image: ghcr.io/linyinfeng/oranc
        strategy:
            matrix: ${{fromJSON(needs.nix-matrix-server.outputs.matrix)}}
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
              with:
                  extra-conf: |
                      accept-flake-config = true
            - uses: linyinfeng/oranc-action@v1
              if: github.event_name != 'pull_request'
              with:
                  orancServerContainer: ${{ job.services.oranc.id }}
                  repositoryPart1: superkenvery
                  repositoryPart2: nju-schedule-ics-nix-cache
                  signingKey: ${{ secrets.ORANC_SIGNING_KEY }}
                  initialize: true
            - run: |
                  attr="${{ matrix.attr }}"
                  attr="${attr/githubActions/githubActions-server}"
                  nix build -L ".#${attr}"

    build-docker-image:
        needs: [nix-matrix-docker, build-server-binary] # Let's use the cache from building server
        runs-on: ${{ matrix.os }}
        strategy:
            matrix: ${{fromJSON(needs.nix-matrix-docker.outputs.matrix)}}
        permissions:
            contents: read
            packages: write
        services:
            oranc:
                image: ghcr.io/linyinfeng/oranc
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
              with:
                  extra-conf: |
                      accept-flake-config = true
            - uses: linyinfeng/oranc-action@v1
              if: github.event_name != 'pull_request'
              with:
                  orancServerContainer: ${{ job.services.oranc.id }}
                  repositoryPart1: superkenvery
                  repositoryPart2: nju-schedule-ics-nix-cache
                  signingKey: ${{ secrets.ORANC_SIGNING_KEY }}
                  initialize: true
            - run: |
                  attr="${{ matrix.attr }}"
                  attr="${attr/githubActions/githubActions-docker}"
                  nix build -L ".#${attr}"

            - name: Push arch-specific image to GHCR
              run: |
                  IMAGE_PATH=$(readlink -f result)
                  OS="${{ matrix.system }}"
                  OWNER_LOWER_CASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

                  # Determine TAG_NAME
                  if [[ "${{ github.ref_type }}" == "tag" ]]; then
                    TAG_NAME="${{ github.ref_name }}"
                  else
                    TAG_NAME="latest"
                  fi

                  case "$OS" in
                    x86_64-linux)
                      ARCH_SUFFIX="amd64"
                      ;;
                    aarch64-linux)
                      ARCH_SUFFIX="arm64"
                      ;;
                    *)
                      echo "Unsupported system: $OS" >&2
                      exit 1
                      ;;
                  esac

                  FULL_IMAGE_NAME="ghcr.io/${OWNER_LOWER_CASE}/nju-schedule-ics:${TAG_NAME}-${ARCH_SUFFIX}"
                  echo "Pushing to $FULL_IMAGE_NAME"

                  # The Nix-provided skopeo may be newer than the runner's
                  # system registries.conf. A user config takes precedence and
                  # avoids parsing the runner's legacy v1 configuration.
                  install -D -m 0644 /dev/null "$HOME/.config/containers/registries.conf"

                  nix run nixpkgs#skopeo -- copy \
                    --dest-creds="${{ github.actor }}:${{ github.token }}" \
                    "docker-archive:$IMAGE_PATH" \
                    "docker://$FULL_IMAGE_NAME"

    publish-multiarch-manifest:
        needs: build-docker-image
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - uses: DeterminateSystems/nix-installer-action@main
            - name: Publish multi-arch manifest to GHCR
              env:
                DOCKER_USERNAME: ${{ github.actor }}
                DOCKER_PASSWORD: ${{ github.token }}
              run: |
                OWNER_LOWER_CASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

                # Determine TAG_NAME
                if [[ "${{ github.ref_type }}" == "tag" ]]; then
                  TAG_NAME="${{ github.ref_name }}"
                else
                  TAG_NAME="latest"
                fi

                IMAGE_BASE="ghcr.io/${OWNER_LOWER_CASE}/nju-schedule-ics"

                nix run nixpkgs#manifest-tool -- \
                  --username "$DOCKER_USERNAME" \
                  --password "$DOCKER_PASSWORD" \
                  push from-args \
                  --platforms linux/amd64,linux/arm64 \
                  --template "${IMAGE_BASE}:${TAG_NAME}-ARCH" \
                  --target "${IMAGE_BASE}:${TAG_NAME}"
